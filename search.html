<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SearchHub - Your Personal Search Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .header-links a {
            text-decoration: none;
            color: #666;
            font-size: 14px;
            transition: color 0.3s;
        }

        .header-links a:hover {
            color: #667eea;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .search-box-container {
            width: 100%;
            max-width: 600px;
        }

        .search-title {
            text-align: center;
            color: white;
            font-size: 48px;
            font-weight: 300;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .search-box {
            position: relative;
            margin-bottom: 30px;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transform: scale(1.02);
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #667eea;
        }

        .search-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-search {
            background-color: #667eea;
            color: white;
        }

        .btn-search:hover {
            background-color: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-lucky {
            background-color: white;
            color: #666;
            border: 1px solid #ddd;
        }

        .btn-lucky:hover {
            background-color: #f8f8f8;
            border-color: #667eea;
        }

        .quick-links {
            text-align: center;
            margin-top: 40px;
        }

        .quick-links-title {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .quick-links-list {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            list-style: none;
        }

        .quick-links-list a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            transition: all 0.3s;
        }

        .quick-links-list a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .search-results {
            display: none;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .search-results.active {
            display: block;
        }

        .result-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-item:hover {
            background-color: #f5f5f5;
        }

        .result-title {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .result-url {
            color: #666;
            font-size: 12px;
            margin-bottom: 5px;
        }

        .result-description {
            color: #888;
            font-size: 13px;
            line-height: 1.5;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
        }

        .tab {
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 14px;
            padding-bottom: 5px;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: white;
            border-bottom-color: white;
        }

        .tab:hover {
            color: white;
        }

        .settings-panel {
            position: fixed;
            right: 0;
            top: 0;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
            transform: translateX(100%);
            transition: transform 0.3s;
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }

        .settings-panel.active {
            transform: translateX(0);
        }

        .settings-close {
            font-size: 24px;
            cursor: pointer;
            color: #666;
            margin-bottom: 20px;
        }

        .settings-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .setting-group {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .setting-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }

        .setting-option {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .setting-option input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .setting-option label {
            cursor: pointer;
            color: #666;
        }

        .footer {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-top: auto;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #666;
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: #667eea;
        }

        @media (max-width: 768px) {
            .search-title {
                font-size: 32px;
            }

            .header-links {
                gap: 15px;
            }

            .search-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .settings-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">SearchHub</div>
        <ul class="header-links">
            <li><a href="#" onclick="showSettings(event)">Settings</a></li>
            <li><a href="#" onclick="clearHistory(event)">Clear History</a></li>
            <li><a href="#" onclick="toggleTheme(event)">Theme</a></li>
        </ul>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <div class="search-box-container">
            <!-- Tabs -->
            <div class="tabs">
                <div class="tab active" data-tab="web">🌐 Web</div>
                <div class="tab" data-tab="history">📚 History</div>
                <div class="tab" data-tab="bookmarks">⭐ Bookmarks</div>
            </div>

            <!-- Search Title -->
            <div class="search-title">SearchHub</div>

            <!-- Search Box -->
            <div class="search-box">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Search the web..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>

            <!-- Search Buttons -->
            <div class="search-buttons">
                <button class="btn btn-search" onclick="performSearch()">SearchHub Search</button>
                <button class="btn btn-lucky" onclick="luckySearch()">I'm Feeling Lucky</button>
            </div>

            <!-- Search Results -->
            <div class="search-results" id="searchResults"></div>

            <!-- Quick Links -->
            <div class="quick-links">
                <div class="quick-links-title">Popular Searches</div>
                <ul class="quick-links-list">
                    <li><a href="#" onclick="quickSearch('AI Technology', event)">AI Technology</a></li>
                    <li><a href="#" onclick="quickSearch('Web Development', event)">Web Development</a></li>
                    <li><a href="#" onclick="quickSearch('JavaScript Tutorials', event)">JavaScript</a></li>
                    <li><a href="#" onclick="quickSearch('Web Design', event)">Web Design</a></li>
                    <li><a href="#" onclick="quickSearch('Cloud Computing', event)">Cloud Computing</a></li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settingsPanel">
        <div class="settings-close" onclick="closeSettings()">✕</div>
        <div class="settings-title">Settings</div>
        
        <div class="setting-group">
            <label class="setting-label">Search Results per Page</label>
            <div class="setting-option">
                <input type="radio" id="results10" name="results" value="10" checked>
                <label for="results10">10 Results</label>
            </div>
            <div class="setting-option">
                <input type="radio" id="results20" name="results" value="20">
                <label for="results20">20 Results</label>
            </div>
            <div class="setting-option">
                <input type="radio" id="results50" name="results" value="50">
                <label for="results50">50 Results</label>
            </div>
        </div>

        <div class="setting-group">
            <label class="setting-label">Options</label>
            <div class="setting-option">
                <input type="checkbox" id="safeSearch" checked>
                <label for="safeSearch">Safe Search</label>
            </div>
            <div class="setting-option">
                <input type="checkbox" id="saveHistory" checked>
                <label for="saveHistory">Save Search History</label>
            </div>
            <div class="setting-option">
                <input type="checkbox" id="autocomplete" checked>
                <label for="autocomplete">Show Suggestions</label>
            </div>
        </div>

        <button class="btn btn-search" style="width: 100%;" onclick="saveSettings()">Save Settings</button>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="footer-links">
            <a href="#" onclick="return false">About</a>
            <a href="#" onclick="return false">Advertising</a>
            <a href="#" onclick="return false">Business</a>
            <a href="#" onclick="return false">Privacy</a>
            <a href="#" onclick="return false">Terms</a>
            <a href="#" onclick="return false">Help</a>
        </div>
        <div style="margin-top: 10px;">© 2026 SearchHub. All rights reserved.</div>
    </div>

    <script>
        // Sample search database
        const sampleResults = {
            'ai technology': [
                { title: 'Artificial Intelligence - Wikipedia', url: 'wikipedia.org/wiki/AI', description: 'Artificial intelligence is intelligence demonstrated by machines, as opposed to the natural intelligence displayed by animals...' },
                { title: 'AI Technology Trends 2026', url: 'techblog.com/ai-trends', description: 'Explore the latest trends in artificial intelligence and machine learning technology for 2026...' },
                { title: 'Machine Learning Basics', url: 'learningplatform.com/ml', description: 'Learn the fundamentals of machine learning and how it powers modern applications...' }
            ],
            'web development': [
                { title: 'Web Development - MDN Web Docs', url: 'mdn.mozilla.org', description: 'Resources for developers, by developers. Discover tools and techniques for building modern websites...' },
                { title: 'Full Stack Web Development Course', url: 'educationplatform.com/web', description: 'Master HTML, CSS, JavaScript, and backend technologies for complete web development...' },
                { title: 'Latest Web Technologies', url: 'webdev.com/latest', description: 'Stay updated with the latest frameworks, tools, and best practices in web development...' }
            ],
            'javascript tutorials': [
                { title: 'JavaScript.info - The Modern JavaScript Tutorial', url: 'javascript.info', description: 'A comprehensive guide to JavaScript for both beginners and advanced developers...' },
                { title: 'Learn JavaScript - Free Course', url: 'codecademy.com/js', description: 'Interactive JavaScript tutorials to help you master the language from scratch...' },
                { title: 'Advanced JavaScript Patterns', url: 'designpatterns.dev', description: 'Explore advanced JavaScript patterns and best practices for professional development...' }
            ]
        };

        let searchHistory = [];
        let bookmarks = [];
        let settings = {
            resultsPerPage: 10,
            safeSearch: true,
            saveHistory: true,
            autocomplete: true
        };

        // Initialize
        function init() {
            loadFromLocalStorage();
            setupEventListeners();
            loadSettings();
        }

        // Setup event listeners
        function setupEventListeners() {
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });

            // Tab switching
            document.querySelectorAll('.tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    switchTab(e.target.dataset.tab);
                });
            });
        }

        // Perform search
        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            if (query.trim() === '') {
                alert('Please enter a search query');
                return;
            }

            // Save to history
            if (settings.saveHistory) {
                addToHistory(query);
            }

            // Get results
            const results = sampleResults[query] || generateMockResults(query);
            displayResults(results);
        }

        // Generate mock results for any query
        function generateMockResults(query) {
            return [
                {
                    title: `Results for "${query}"`,
                    url: 'example.com/search',
                    description: `Here are some results related to your search for "${query}". In a real search engine, this would show actual web pages.`
                },
                {
                    title: `Learn more about ${query}`,
                    url: 'wikipedia.org/search',
                    description: `Wikipedia has extensive information about ${query} and related topics...`
                },
                {
                    title: `${query} - Tutorial & Guide`,
                    url: 'tutorials.dev/search',
                    description: `Comprehensive tutorials and guides to help you understand ${query} better...`
                }
            ];
        }

        // Display search results
        function displayResults(results) {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';
            
            results.slice(0, settings.resultsPerPage).forEach((result, index) => {
                const resultItem = document.createElement('div');
                resultItem.className = 'result-item';
                resultItem.innerHTML = `
                    <div class="result-title">${result.title}</div>
                    <div class="result-url">${result.url}</div>
                    <div class="result-description">${result.description}</div>
                `;
                resultItem.addEventListener('click', () => {
                    addBookmark(result.title);
                });
                resultsDiv.appendChild(resultItem);
            });

            resultsDiv.classList.add('active');
        }

        // I'm Feeling Lucky
        function luckySearch() {
            const query = document.getElementById('searchInput').value;
            if (query.trim() === '') {
                alert('Please enter a search query');
                return;
            }
            alert(`🍀 Feeling lucky for: "${query}"`);
        }

        // Quick search
        function quickSearch(query, event) {
            event.preventDefault();
            document.getElementById('searchInput').value = query;
            performSearch();
        }

        // Add to search history
        function addToHistory(query) {
            const now = new Date().toLocaleString();
            searchHistory.unshift({ query, timestamp: now });
            if (searchHistory.length > 50) {
                searchHistory.pop();
            }
            saveToLocalStorage();
        }

        // Add bookmark
        function addBookmark(title) {
            if (!bookmarks.includes(title)) {
                bookmarks.push(title);
                saveToLocalStorage();
                alert('✭ Added to bookmarks!');
            }
        }

        // Switch tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';

            if (tab === 'web') {
                resultsDiv.classList.remove('active');
            } else if (tab === 'history') {
                displayHistory();
            } else if (tab === 'bookmarks') {
                displayBookmarks();
            }
        }

        // Display history
        function displayHistory() {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';

            if (searchHistory.length === 0) {
                resultsDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No search history</div>';
            } else {
                searchHistory.forEach((item) => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.innerHTML = `
                        <div class="result-title" onclick="quickSearch('${item.query}', event)" style="cursor: pointer;">🕐 ${item.query}</div>
                        <div class="result-url">${item.timestamp}</div>
                    `;
                    resultsDiv.appendChild(resultItem);
                });
            }

            resultsDiv.classList.add('active');
        }

        // Display bookmarks
        function displayBookmarks() {
            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '';

            if (bookmarks.length === 0) {
                resultsDiv.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">No bookmarks yet</div>';
            } else {
                bookmarks.forEach((bookmark) => {
                    const resultItem = document.createElement('div');
                    resultItem.className = 'result-item';
                    resultItem.innerHTML = `
                        <div class="result-title">⭐ ${bookmark}</div>
                    `;
                    resultsDiv.appendChild(resultItem);
                });
            }

            resultsDiv.classList.add('active');
        }

        // Settings
        function showSettings(event) {
            event.preventDefault();
            document.getElementById('settingsPanel').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsPanel').classList.remove('active');
        }

        function saveSettings() {
            settings.resultsPerPage = parseInt(document.querySelector('input[name="results"]:checked').value);
            settings.safeSearch = document.getElementById('safeSearch').checked;
            settings.saveHistory = document.getElementById('saveHistory').checked;
            settings.autocomplete = document.getElementById('autocomplete').checked;
            
            saveToLocalStorage();
            alert('✓ Settings saved!');
            closeSettings();
        }

        function loadSettings() {
            document.querySelector(`input[value="${settings.resultsPerPage}"]`).checked = true;
            document.getElementById('safeSearch').checked = settings.safeSearch;
            document.getElementById('saveHistory').checked = settings.saveHistory;
            document.getElementById('autocomplete').checked = settings.autocomplete;
        }

        // Clear history
        function clearHistory(event) {
            event.preventDefault();
            if (confirm('Are you sure you want to clear all search history?')) {
                searchHistory = [];
                saveToLocalStorage();
                alert('✓ History cleared!');
            }
        }

        // Toggle theme
        function toggleTheme(event) {
            event.preventDefault();
            document.body.style.filter = document.body.style.filter === 'invert(1)' ? 'invert(0)' : 'invert(1)';
        }

        // Local Storage
        function saveToLocalStorage() {
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            localStorage.setItem('settings', JSON.stringify(settings));
        }

        function loadFromLocalStorage() {
            const storedHistory = localStorage.getItem('searchHistory');
            const storedBookmarks = localStorage.getItem('bookmarks');
            const storedSettings = localStorage.getItem('settings');

            if (storedHistory) searchHistory = JSON.parse(storedHistory);
            if (storedBookmarks) bookmarks = JSON.parse(storedBookmarks);
            if (storedSettings) settings = JSON.parse(storedSettings);
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
